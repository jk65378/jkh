<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
        }
        canvas { background-color: #222; display: block; }
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.7); padding: 10px 15px;
            border-radius: 5px; border: 1px solid #444; font-size: 18px; font-weight: bold;
        }
        .wanted-stars { color: #ffd700; font-size: 22px; letter-spacing: 3px; }
        #controls-info {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.6); padding: 8px 12px;
            border-radius: 4px; font-size: 12px; color: #ccc; pointer-events: none;
        }
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(150, 0, 0, 0.9); padding: 30px 50px; border-radius: 10px;
            text-align: center; display: none; box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }
        #game-over h1 { font-size: 48px; margin-bottom: 15px; text-transform: uppercase; }
        #game-over button {
            background: #fff; color: #900; border: none; padding: 10px 25px;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div id="hud">
        <div class="hud-box">
            STATUS: <span id="mode-val" style="color: #ff9900;">ON FOOT</span><br>
            HEALTH: <span id="hp-val" style="color: #0f0;">100</span>% | SCORE: <span id="score-val" style="color: #0cf;">0</span>
        </div>
        <div class="hud-box" style="text-align: right;">
            WANTED<br><span id="wanted-val" class="wanted-stars">☆☆☆☆☆</span>
        </div>
    </div>
    <div id="controls-info">
        [W/A/S/D] 이동/운전 | [F] 차 탈취 및 승/하차 | [Space] 총기 사격
    </div>
    <div id="game-over">
        <h1>BUSTED / WASTED</h1>
        <p>최종 점수: <span id="final-score">0</span></p>
        <button onclick="restartGame()">다시 시작 (R)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- 오디오 Synth ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    if (type === 'shoot') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'explode') {
        osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// --- 게임 환경 ---
const MAP_SIZE = 2400;
let keys = {};
let gameOver = false;
let score = 0;
let wantedLevel = 0;

const buildings = [
    {x: 200, y: 200, w: 500, h: 400, h3d: 40},
    {x: 900, y: 200, w: 600, h: 400, h3d: 50},
    {x: 1700, y: 200, w: 500, h: 500, h3d: 35},
    {x: 200, y: 800, w: 500, h: 700, h3d: 60},
    {x: 900, y: 800, w: 600, h: 700, h3d: 45},
    {x: 1700, y: 900, w: 500, h: 600, h3d: 55},
    {x: 200, y: 1700, w: 800, h: 500, h3d: 40},
    {x: 1200, y: 1700, w: 1000, h: 500, h3d: 50}
];

// 플레이어 상태
let player = {
    x: 750, y: 700, radius: 10, angle: 0, speed: 3.5, hp: 100,
    inCar: null, lastShot: 0
};

let vehicles = [];
let peds = []; // 보행자 (시민 & 경찰)
let bullets = [];
let particles = [];

// 키 입력 이벤트
window.addEventListener('keydown', e => {
    if (e.code === 'KeyF') toggleVehicleEntry();
    if (e.code === 'KeyR' && gameOver) restartGame();
    keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// 차량 스폰
function spawnVehicle(isCop = false) {
    let spawnX, spawnY, safe = false;
    while(!safe) {
        spawnX = Math.random() * (MAP_SIZE - 200) + 100;
        spawnY = Math.random() * (MAP_SIZE - 200) + 100;
        safe = !buildings.some(b => spawnX > b.x - 40 && spawnX < b.x + b.w + 40 && spawnY > b.y - 40 && spawnY < b.y + b.h + 40);
    }
    vehicles.push({
        x: spawnX, y: spawnY, w: 22, h: 42, angle: Math.random() * Math.PI * 2,
        speed: 0, maxSpeed: isCop ? 6.5 : 4.5, accel: 0.15, friction: 0.95, turnSpeed: 0.045,
        color: isCop ? '#111' : ['#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6'][Math.floor(Math.random()*5)],
        hp: isCop ? 80 : 50, isCop: isCop, driver: 'npc'
    });
}

// 보행자 스폰
function spawnPedestrian(isCop = false, x = null, y = null) {
    peds.push({
        x: x || Math.random() * (MAP_SIZE - 200) + 100,
        y: y || Math.random() * (MAP_SIZE - 200) + 100,
        angle: Math.random() * Math.PI * 2,
        speed: isCop ? 2.8 : 1.5, hp: isCop ? 40 : 20, isCop: isCop, lastShot: 0
    });
}

// 초기 오브젝트 배치
for(let i=0; i<10; i++) spawnVehicle(false);
for(let i=0; i<15; i++) spawnPedestrian(false);

// 건물 충돌 감지
function checkBuildingCollision(x, y, radius) {
    return buildings.some(b => x + radius > b.x && x - radius < b.x + b.w && y + radius > b.y && y - radius < b.y + b.h);
}

// 차량 탑승 / 하차 처리 (F키)
function toggleVehicleEntry() {
    if (gameOver) return;

    if (player.inCar) {
        // 하차
        let car = player.inCar;
        player.x = car.x + Math.cos(car.angle) * 25;
        player.y = car.y + Math.sin(car.angle) * 25;
        car.driver = null;
        player.inCar = null;
    } else {
        // 탑승: 가장 가까운 차 찾기 (거리 45px 이내)
        let nearCar = vehicles.find(v => Math.hypot(v.x - player.x, v.y - player.y) < 45);
        if (nearCar) {
            if (nearCar.driver === 'npc') {
                // 운전자 밀쳐내고 강탈
                spawnPedestrian(false, nearCar.x, nearCar.y);
                score += 50;
            }
            player.inCar = nearCar;
            nearCar.driver = 'player';
        }
    }
}

// 폭발 처리
function createExplosion(x, y) {
    playSound('explode');
    for (let i = 0; i < 25; i++) {
        particles.push({
            x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            life: 30 + Math.random() * 20, color: ['#ff4500', '#ffa500', '#ff0000', '#555'][Math.floor(Math.random()*4)], size: Math.random() * 6 + 3
        });
    }
}

// --- 게임 업데이트 ---
function update() {
    if (gameOver) return;

    // 1. 플레이어 업데이트
    if (player.inCar) {
        // [차량 탑승 중 조작]
        let car = player.inCar;
        if (keys['KeyW'] || keys['ArrowUp']) car.speed = Math.min(car.maxSpeed, car.speed + car.accel);
        if (keys['KeyS'] || keys['ArrowDown']) car.speed = Math.max(-car.maxSpeed * 0.4, car.speed - car.accel * 0.8);
        if (Math.abs(car.speed) > 0.2) {
            let dir = car.speed > 0 ? 1 : -1;
            if (keys['KeyA'] || keys['ArrowLeft']) car.angle -= car.turnSpeed * dir;
            if (keys['KeyD'] || keys['ArrowRight']) car.angle += car.turnSpeed * dir;
        }
        car.speed *= car.friction;

        let nextX = car.x + Math.sin(car.angle) * car.speed;
        let nextY = car.y - Math.cos(car.angle) * car.speed;

        if (!checkBuildingCollision(nextX, car.y, 15)) car.x = nextX; else { car.speed *= -0.5; player.hp -= Math.abs(car.speed); }
        if (!checkBuildingCollision(car.x, nextY, 15)) car.y = nextY; else { car.speed *= -0.5; player.hp -= Math.abs(car.speed); }
        
        player.x = car.x; player.y = car.y; player.angle = car.angle;
    } else {
        // [보행 상태 조작]
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

        if (dx !== 0 || dy !== 0) {
            player.angle = Math.atan2(dy, dx) + Math.PI / 2;
            let moveX = player.x + (dx !== 0 && dy !== 0 ? dx * 0.707 : dx) * player.speed;
            let moveY = player.y + (dx !== 0 && dy !== 0 ? dy * 0.707 : dy) * player.speed;
            if (!checkBuildingCollision(moveX, player.y, player.radius)) player.x = moveX;
            if (!checkBuildingCollision(player.x, moveY, player.radius)) player.y = moveY;
        }
    }

    // 2. 사격
    if (keys['Space'] && Date.now() - player.lastShot > 130) {
        player.lastShot = Date.now();
        playSound('shoot');
        bullets.push({
            x: player.x + Math.sin(player.angle) * 20,
            y: player.y - Math.cos(player.angle) * 20,
            vx: Math.sin(player.angle) * 14, vy: -Math.cos(player.angle) * 14,
            life: 50, isPlayer: true
        });
    }

    // 3. 경찰 스폰 관리
    if (wantedLevel > 0 && Math.random() < 0.01 + wantedLevel * 0.005) {
        if (vehicles.filter(v => v.isCop).length < wantedLevel) spawnVehicle(true);
        if (peds.filter(p => p.isCop).length < wantedLevel * 2) spawnPedestrian(true);
    }

    // 4. 차량 AI 및 로직
    vehicles.forEach((v, idx) => {
        if (v === player.inCar) return;

        if (v.isCop && wantedLevel > 0) {
            // [경찰차 AI] 플레이어 추적 및 시야 장애물 회피
            let targetAngle = Math.atan2(player.x - v.x, -(player.y - v.y));
            let diff = targetAngle - v.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            v.angle += Math.sign(diff) * 0.04;
            v.speed = Math.min(v.maxSpeed, v.speed + v.accel);

            // 차에서 내려서 쫓아가기 (플레이어가 도보 중이고 가까울 때)
            if (!player.inCar && Math.hypot(player.x - v.x, player.y - v.y) < 120 && Math.random() < 0.03) {
                spawnPedestrian(true, v.x, v.y);
                v.isCop = false; // 경찰차 버림
            }
        } else if (v.driver === 'npc') {
            // [일반차 AI] 건물 앞 감지 후 우회
            let frontX = v.x + Math.sin(v.angle) * 40;
            let frontY = v.y - Math.cos(v.angle) * 40;
            if (checkBuildingCollision(frontX, frontY, 10)) {
                v.angle += 0.1; // 건물 회피 회전
                v.speed *= 0.8;
            } else {
                v.speed = Math.min(v.maxSpeed * 0.6, v.speed + v.accel);
            }
        }

        v.speed *= v.friction;
        let nextX = v.x + Math.sin(v.angle) * v.speed;
        let nextY = v.y - Math.cos(v.angle) * v.speed;
        if (!checkBuildingCollision(nextX, nextY, 15)) { v.x = nextX; v.y = nextY; }
        else { v.angle += Math.PI * 0.7; v.speed *= -0.3; }

        // 로드킬 (보행자 치기)
        peds.forEach((p, pIdx) => {
            if (Math.hypot(v.x - p.x, v.y - p.y) < 20 && Math.abs(v.speed) > 2) {
                peds.splice(pIdx, 1);
                createExplosion(p.x, p.y);
                if (v === player.inCar) {
                    score += 50;
                    if (wantedLevel < 5 && Math.random() < 0.4) wantedLevel++;
                }
            }
        });
        
        // 보행 중 플레이어 들이받기
        if (!player.inCar && Math.hypot(v.x - player.x, v.y - player.y) < 20 && Math.abs(v.speed) > 1.5) {
            player.hp -= Math.abs(v.speed) * 5;
        }
    });

    // 5. 보행자 AI (경찰 & 일반 시민)
    peds.forEach((p, idx) => {
        let dx = player.x - p.x;
        let dy = player.y - p.y;
        let dist = Math.hypot(dx, dy);

        if (p.isCop && wantedLevel > 0) {
            // [경찰 보행자 AI] 플레이어 추적 및 권총 사격
            p.angle = Math.atan2(dy, dx) + Math.PI / 2;
            if (dist > 60) {
                let moveX = p.x + Math.cos(p.angle - Math.PI/2) * p.speed;
                let moveY = p.y + Math.sin(p.angle - Math.PI/2) * p.speed;
                if (!checkBuildingCollision(moveX, moveY, 8)) { p.x = moveX; p.y = moveY; }
            } else if (Date.now() - p.lastShot > 800) {
                // 권총 발사
                p.lastShot = Date.now();
                playSound('shoot');
                bullets.push({
                    x: p.x, y: p.y, vx: Math.cos(p.angle - Math.PI/2) * 8, vy: Math.sin(p.angle - Math.PI/2) * 8,
                    life: 40, isPlayer: false
                });
            }
        } else {
            // [일반 보행자 AI] 배회 및 사격 시 도망
            if (Math.random() < 0.02) p.angle += (Math.random() - 0.5);
            let moveX = p.x + Math.cos(p.angle) * p.speed;
            let moveY = p.y + Math.sin(p.angle) * p.speed;
            if (!checkBuildingCollision(moveX, moveY, 8)) { p.x = moveX; p.y = moveY; }
            else { p.angle += Math.PI; }
        }
    });

    // 6. 총알 처리
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy; b.life--;

        if (checkBuildingCollision(b.x, b.y, 2) || b.life <= 0) {
            bullets.splice(i, 1); continue;
        }

        // 플레이어가 맞음 (적 경찰 총알)
        if (!b.isPlayer && Math.hypot(b.x - player.x, b.y - player.y) < 15) {
            player.hp -= 8;
            bullets.splice(i, 1);
            continue;
        }

        // 플레이어 총알이 적/차량에 맞음
        if (b.isPlayer) {
            // 차량 충돌
            for (let v of vehicles) {
                if (Math.hypot(b.x - v.x, b.y - v.y) < 22) {
                    v.hp -= 25; bullets.splice(i, 1);
                    if (v.hp <= 0) {
                        createExplosion(v.x, v.y);
                        score += v.isCop ? 200 : 100;
                        if (wantedLevel < 5) wantedLevel = Math.min(5, wantedLevel + 1);
                        vehicles = vehicles.filter(item => item !== v);
                        if (player.inCar === v) player.inCar = null;
                    }
                    break;
                }
            }
            // 보행자 충돌
            for (let pIdx = peds.length - 1; pIdx >= 0; pIdx--) {
                let p = peds[pIdx];
                if (Math.hypot(b.x - p.x, b.y - p.y) < 12) {
                    peds.splice(pIdx, 1); bullets.splice(i, 1);
                    createExplosion(p.x, p.y);
                    score += p.isCop ? 150 : 50;
                    if (wantedLevel < 5 && Math.random() < 0.5) wantedLevel++;
                    break;
                }
            }
        }
    }

    // 7. 파티클
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 게임 오버
    if (player.hp <= 0) {
        player.hp = 0; createExplosion(player.x, player.y); gameOver = true;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'block';
    }

    // HUD 업데이트
    document.getElementById('mode-val').innerText = player.inCar ? "DRIVING" : "ON FOOT";
    document.getElementById('mode-val').style.color = player.inCar ? "#0cf" : "#ff9900";
    document.getElementById('hp-val').innerText = Math.ceil(player.hp);
    document.getElementById('score-val').innerText = score;
    document.getElementById('wanted-val').innerText = '★'.repeat(wantedLevel) + '☆'.repeat(5 - wantedLevel);
}

// --- 렌더링 ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let camX = player.x - canvas.width / 2;
    let camY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    // 바닥/도로
    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    for (let x = 0; x < MAP_SIZE; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke(); }
    for (let y = 0; y < MAP_SIZE; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke(); }

    // 건물 (Pseudo 3D)
    buildings.forEach(b => {
        ctx.fillStyle = '#111'; ctx.fillRect(b.x, b.y, b.w, b.h);
        let offX = (b.x + b.w/2 - player.x) * 0.08, offY = (b.y + b.h/2 - player.y) * 0.08;
        ctx.fillStyle = '#3a4454';
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + b.w, b.y);
        ctx.lineTo(b.x + b.w + offX, b.y + offY); ctx.lineTo(b.x + offX, b.y + offY); ctx.fill();
        ctx.fillStyle = '#5c6b73'; ctx.fillRect(b.x + offX, b.y + offY, b.w, b.h);
    });

    // 보행자 그리기 (원 및 시선 표시)
    peds.forEach(p => {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
        ctx.fillStyle = p.isCop ? '#0055ff' : '#e74c3c';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffe0bd'; // 머리
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    });

    // 플레이어 (도보 상태일 때만 따로 그리기)
    if (!player.inCar && !gameOver) {
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
        ctx.fillStyle = '#2ecc71'; // 몸통
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffe0bd'; // 머리
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#333'; // 총구
        ctx.fillRect(3, -10, 3, 8);
        ctx.restore();
    }

    // 차량 그리기
    vehicles.forEach(v => {
        ctx.save(); ctx.translate(v.x, v.y); ctx.rotate(v.angle);
        ctx.fillStyle = v.color; ctx.fillRect(-11, -21, 22, 42);
        ctx.fillStyle = '#111'; ctx.fillRect(-8, -8, 16, 10); ctx.fillRect(-8, 12, 16, 5);
        if (v.isCop) {
            let flash = Math.floor(Date.now() / 150) % 2 === 0;
            ctx.fillStyle = flash ? '#f00' : '#00f'; ctx.fillRect(-6, -2, 12, 5);
        }
        ctx.restore();
    });

    // 총알 및 파티클
    ctx.fillStyle = '#ffff00';
    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill(); });
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });

    ctx.restore();
}

function loop() { update(); render(); requestAnimationFrame(loop); }

function restartGame() {
    player.x = 750; player.y = 700; player.hp = 100; player.inCar = null;
    score = 0; wantedLevel = 0; bullets = []; peds = []; vehicles = []; gameOver = false;
    document.getElementById('game-over').style.display = 'none';
    for(let i=0; i<10; i++) spawnVehicle(false);
    for(let i=0; i<15; i++) spawnPedestrian(false);
}

loop();
</script>
</body>
</html>
