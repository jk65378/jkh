<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
        }
        canvas {
            background-color: #222;
            display: block;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #444;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        .wanted-stars {
            color: #ffd700;
            font-size: 22px;
            letter-spacing: 3px;
        }
        #controls-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(150, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
            display: none;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }
        #game-over h1 {
            font-size: 48px;
            margin-bottom: 15px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #game-over button {
            background: #fff;
            color: #900;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        #game-over button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="900" height="600"></canvas>
    
    <!-- HUD -->
    <div id="hud">
        <div class="hud-box">
            HEALTH: <span id="hp-val" style="color: #0f0;">100</span>%<br>
            SCORE: <span id="score-val" style="color: #0cf;">0</span>
        </div>
        <div class="hud-box" style="text-align: right;">
            WANTED<br>
            <span id="wanted-val" class="wanted-stars">☆☆☆☆☆</span>
        </div>
    </div>

    <!-- 조작법 안내 -->
    <div id="controls-info">
        [W/S or ↑/↓] 가속 / 후진 | [A/D or ←/→] 조향 | [Space] 기관총 발사
    </div>

    <!-- 게임 오버 창 -->
    <div id="game-over">
        <h1>BUSTED / WASTED</h1>
        <p>최종 점수: <span id="final-score">0</span></p>
        <button onclick="restartGame()">다시 시작 (R)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- 오디오 효과 (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'explode') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// --- 게임 상태 및 맵 설정 ---
const MAP_SIZE = 2400;
let keys = {};
let gameOver = false;
let score = 0;
let wantedLevel = 0;

// 빌딩 맵 데이터 (x, y, width, height, height3D)
const buildings = [
    {x: 200, y: 200, w: 500, h: 400, h3d: 40},
    {x: 900, y: 200, w: 600, h: 400, h3d: 50},
    {x: 1700, y: 200, w: 500, h: 500, h3d: 35},
    {x: 200, y: 800, w: 500, h: 700, h3d: 60},
    {x: 900, y: 800, w: 600, h: 700, h3d: 45},
    {x: 1700, y: 900, w: 500, h: 600, h3d: 55},
    {x: 200, y: 1700, w: 800, h: 500, h3d: 40},
    {x: 1200, y: 1700, w: 1000, h: 500, h3d: 50}
];

// 플레이어 (차량)
let player = {
    x: 750,
    y: 700,
    w: 24,
    h: 44,
    angle: 0,
    speed: 0,
    maxSpeed: 7,
    accel: 0.18,
    friction: 0.96,
    turnSpeed: 0.05,
    hp: 100,
    lastShot: 0
};

let bullets = [];
let npcCars = [];
let copCars = [];
let particles = [];

// --- 입력 처리 ---
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && gameOver) restartGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- NPC & 경찰 차량 생성 ---
function spawnNpcCar() {
    const isCop = arguments[0] || false;
    let spawnX, spawnY;
    let safe = false;
    while(!safe) {
        spawnX = Math.random() * (MAP_SIZE - 200) + 100;
        spawnY = Math.random() * (MAP_SIZE - 200) + 100;
        safe = !buildings.some(b => 
            spawnX > b.x - 50 && spawnX < b.x + b.w + 50 &&
            spawnY > b.y - 50 && spawnY < b.y + b.h + 50
        );
    }
    
    const car = {
        x: spawnX,
        y: spawnY,
        w: 22,
        h: 42,
        angle: Math.random() * Math.PI * 2,
        speed: isCop ? 5.5 : Math.random() * 2 + 1.5,
        color: isCop ? '#222' : ['#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6'][Math.floor(Math.random()*5)],
        hp: isCop ? 60 : 40,
        isCop: isCop
    };

    if (isCop) copCars.push(car);
    else npcCars.push(car);
}

// 초기 시민 차량 생성
for(let i = 0; i < 12; i++) spawnNpcCar(false);

// --- 충돌 감지 함수 ---
function checkBuildingCollision(x, y, radius) {
    for (let b of buildings) {
        if (x + radius > b.x && x - radius < b.x + b.w &&
            y + radius > b.y && y - radius < b.y + b.h) {
            return true;
        }
    }
    return false;
}

// --- 폭발 파티클 생성 ---
function createExplosion(x, y, count = 20) {
    playSound('explode');
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 30 + Math.random() * 20,
            color: ['#ff4500', '#ffa500', '#ff0000', '#555'][Math.floor(Math.random()*4)],
            size: Math.random() * 6 + 3
        });
    }
}

// --- 게임 업데이터 ---
function update() {
    if (gameOver) return;

    // 1. 플레이어 조작
    if (keys['KeyW'] || keys['ArrowUp']) {
        if (player.speed < player.maxSpeed) player.speed += player.accel;
    }
    if (keys['KeyS'] || keys['ArrowDown']) {
        if (player.speed > -player.maxSpeed * 0.4) player.speed -= player.accel * 0.8;
    }
    
    // 조향 (속도에 비례해서 회전)
    if (Math.abs(player.speed) > 0.2) {
        const dir = player.speed > 0 ? 1 : -1;
        if (keys['KeyA'] || keys['ArrowLeft']) player.angle -= player.turnSpeed * dir;
        if (keys['KeyD'] || keys['ArrowRight']) player.angle += player.turnSpeed * dir;
    }

    player.speed *= player.friction;

    // 위치 이동 및 건물 충돌
    let nextX = player.x + Math.sin(player.angle) * player.speed;
    let nextY = player.y - Math.cos(player.angle) * player.speed;

    if (!checkBuildingCollision(nextX, player.y, 15)) player.x = nextX;
    else { player.speed *= -0.5; player.hp -= Math.abs(player.speed) * 2; }

    if (!checkBuildingCollision(player.x, nextY, 15)) player.y = nextY;
    else { player.speed *= -0.5; player.hp -= Math.abs(player.speed) * 2; }

    // 맵 경계 제한
    player.x = Math.max(50, Math.min(MAP_SIZE - 50, player.x));
    player.y = Math.max(50, Math.min(MAP_SIZE - 50, player.y));

    // 2. 총알 발사
    if (keys['Space'] && Date.now() - player.lastShot > 120) {
        player.lastShot = Date.now();
        playSound('shoot');
        bullets.push({
            x: player.x + Math.sin(player.angle) * 22,
            y: player.y - Math.cos(player.angle) * 22,
            vx: Math.sin(player.angle) * 14,
            vy: -Math.cos(player.angle) * 14,
            life: 50
        });
    }

    // 3. 총알 업데이트 및 충돌
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // 건물 충돌 Check
        if (checkBuildingCollision(b.x, b.y, 2) || b.life <= 0) {
            bullets.splice(i, 1);
            continue;
        }

        // NPC 차 맞춤 Check
        let allVehicles = [...npcCars, ...copCars];
        for (let v of allVehicles) {
            let dist = Math.hypot(b.x - v.x, b.y - v.y);
            if (dist < 20) {
                v.hp -= 20;
                bullets.splice(i, 1);
                
                // 차가 파괴되었을 때
                if (v.hp <= 0) {
                    createExplosion(v.x, v.y);
                    score += v.isCop ? 250 : 100;
                    if (wantedLevel < 5) wantedLevel = Math.min(5, wantedLevel + 1);

                    if (v.isCop) copCars = copCars.filter(c => c !== v);
                    else npcCars = npcCars.filter(c => c !== v);
                    
                    // 새 NPC 차량 보충
                    setTimeout(() => spawnNpcCar(false), 5000);
                }
                break;
            }
        }
    }

    // 4. 수배 수준에 따른 경찰차 생성
    if (copCars.length < wantedLevel && Math.random() < 0.02) {
        spawnNpcCar(true);
    }

    // 5. NPC & 경찰 AI 업데이트
    [...npcCars, ...copCars].forEach(v => {
        if (v.isCop) {
            // 경찰: 플레이어 추적
            let targetAngle = Math.atan2(player.x - v.x, -(player.y - v.y));
            let diff = targetAngle - v.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            v.angle += Math.sign(diff) * 0.04;

            let vx = Math.sin(v.angle) * v.speed;
            let vy = -Math.cos(v.angle) * v.speed;
            if (!checkBuildingCollision(v.x + vx, v.y + vy, 15)) {
                v.x += vx; v.y += vy;
            } else { v.angle += Math.PI * 0.5; }

            // 플레이어와 충돌 시 데미지
            if (Math.hypot(player.x - v.x, player.y - v.y) < 25) {
                player.hp -= 0.5;
                player.speed *= 0.8;
            }
        } else {
            // 일반 차량: 그냥 드라이브
            let vx = Math.sin(v.angle) * v.speed;
            let vy = -Math.cos(v.angle) * v.speed;
            if (!checkBuildingCollision(v.x + vx, v.y + vy, 15)) {
                v.x += vx; v.y += vy;
            } else {
                v.angle += Math.PI * 0.8;
            }
        }
    });

    // 6. 파티클 업데이트
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 7. 체력 및 게임오버 확인
    if (player.hp <= 0) {
        player.hp = 0;
        createExplosion(player.x, player.y, 40);
        gameOver = true;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'block';
    }

    // HUD 업데이트
    document.getElementById('hp-val').innerText = Math.ceil(player.hp);
    document.getElementById('score-val').innerText = score;
    document.getElementById('wanted-val').innerText = '★'.repeat(wantedLevel) + '☆'.repeat(5 - wantedLevel);
}

// --- 렌더링 (GTA 2 특유의 카메라 & 탑뷰 pseudo-3D 빌딩) ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 카메라 위치 (플레이어 중심)
    let camX = player.x - canvas.width / 2;
    let camY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    // 1. 도로/바닥 배경 그리드
    ctx.fillStyle = '#282828';
    ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

    // 차선 가이드
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 4;
    for (let x = 0; x < MAP_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
    }
    for (let y = 0; y < MAP_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
    }

    // 2. 빌딩 그린 (GTA 2 스타일 3D 벽면 투시 착시 효과)
    buildings.forEach(b => {
        // 빌딩 밑바닥 (검은 그림자)
        ctx.fillStyle = '#111';
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // 시점 중심과의 거리에 따른 3D 옥상 오프셋 계산 (GTA 2 시그니처 3D 효과)
        let roofOffsetX = (b.x + b.w/2 - player.x) * 0.08;
        let roofOffsetY = (b.y + b.h/2 - player.y) * 0.08;

        // 벽면 그리기
        ctx.fillStyle = '#444c56';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + b.w, b.y);
        ctx.lineTo(b.x + b.w + roofOffsetX, b.y + roofOffsetY);
        ctx.lineTo(b.x + roofOffsetX, b.y + roofOffsetY);
        ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + b.h);
        ctx.lineTo(b.x + b.w, b.y + b.h);
        ctx.lineTo(b.x + b.w + roofOffsetX, b.y + b.h + roofOffsetY);
        ctx.lineTo(b.x + roofOffsetX, b.y + b.h + roofOffsetY);
        ctx.fill();

        // 빌딩 지붕 (Roof)
        ctx.fillStyle = '#6c7a89';
        ctx.fillRect(b.x + roofOffsetX, b.y + roofOffsetY, b.w, b.h);
        ctx.strokeStyle = '#8999a8';
        ctx.lineWidth = 3;
        ctx.strokeRect(b.x + roofOffsetX, b.y + roofOffsetY, b.w, b.h);
    });

    // 3. 총알 그리기
    ctx.fillStyle = '#ffff00';
    bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
    });

    // 4. 차량 그리기 함수
    function drawCar(x, y, angle, color, isCop = false) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // 차체
        ctx.fillStyle = color;
        ctx.fillRect(-11, -21, 22, 42);

        // 앞유리 / 뒷유리
        ctx.fillStyle = '#111';
        ctx.fillRect(-8, -8, 16, 10);
        ctx.fillRect(-8, 12, 16, 5);

        // 헤드라이트 (빛 효과)
        ctx.fillStyle = 'rgba(255, 255, 200, 0.3)';
        ctx.beginPath();
        ctx.moveTo(-8, -21); ctx.lineTo(-20, -60); ctx.lineTo(20, -60); ctx.lineTo(8, -21);
        ctx.fill();

        // 경찰차 경광등
        if (isCop) {
            let flash = Math.floor(Date.now() / 150) % 2 === 0;
            ctx.fillStyle = flash ? '#f00' : '#00f';
            ctx.fillRect(-6, -2, 12, 5);
        }

        ctx.restore();
    }

    // NPC 및 경찰 차량 그리기
    npcCars.forEach(c => drawCar(c.x, c.y, c.angle, c.color));
    copCars.forEach(c => drawCar(c.x, c.y, c.angle, c.color, true));

    // 플레이어 차량 그리기
    if (!gameOver) {
        drawCar(player.x, player.y, player.angle, '#e67e22');
    }

    // 5. 폭발 파티클
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();
}

// --- 게임 루프 ---
function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

// --- 재시작 ---
function restartGame() {
    player.x = 750;
    player.y = 700;
    player.speed = 0;
    player.angle = 0;
    player.hp = 100;
    score = 0;
    wantedLevel = 0;
    bullets = [];
    copCars = [];
    gameOver = false;
    document.getElementById('game-over').style.display = 'none';
}

// 루프 실행
loop();
</script>
</body>
</html>
